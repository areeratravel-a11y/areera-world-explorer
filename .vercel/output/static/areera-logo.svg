<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="#070D1E"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#border_grad)" stroke-width="8" stroke-opacity="0.6"/>
  
  <defs>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="blue_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="chrome_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Globe Grid -->
  <circle cx="256" cy="256" r="180" stroke="url(#blue_grad)" stroke-width="8" stroke-opacity="0.35"/>
  <ellipse cx="256" cy="256" rx="180" ry="80" stroke="url(#blue_grad)" stroke-width="6" stroke-opacity="0.45" transform="rotate(-20 256 256)"/>
  <path d="M 256 76 C 160 160 160 352 256 436" stroke="url(#blue_grad)" stroke-width="6" stroke-opacity="0.35"/>
  <path d="M 256 76 C 352 160 352 352 256 436" stroke="url(#blue_grad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Monogram A -->
  <path d="M 256 100 L 140 390 L 195 390 L 230 300 L 282 300 L 317 390 L 372 390 Z M 256 195 L 216 270 L 296 270 Z" fill="url(#chrome_grad)" filter="url(#glow)"/>

  <!-- Flight Jet Motif -->
  <path d="M 410 110 L 320 180 L 280 160 L 290 130 L 260 140 L 240 120 L 210 135 L 230 190 L 110 280 L 120 300 L 260 230 L 340 270 L 330 300 L 360 290 L 380 320 L 400 310 L 380 240 L 450 160 C 460 150 450 120 410 110 Z" fill="url(#gold_grad)" filter="url(#glow)"/>

  <!-- Orbit Trail -->
  <path d="M 80 370 Q 200 280 410 120" stroke="url(#gold_grad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 16" stroke-opacity="0.85"/>
</svg>
